name: CuePilot for Android

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/CuePilot.Android/**"
      - "apps/CuePilotDesktop/Models/**"
      - "apps/CuePilotDesktop/Services/**"
      - "apps/CuePilotDesktop/ViewModels/**"
      - "apps/CuePilotDesktop/Resources/**"
      - "apps/CuePilotDesktop/Views/Controls/MarkdownBlocks.cs"
      - "apps/CuePilot.Avalonia/Themes/**"
      - "apps/CuePilot.Avalonia/Views/Controls/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

# A newer push replaces a build still running, so «android-latest» always gets the newest APK.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner's default SDK is newer and refuses net8.0-android; global.json next to the project keeps the
      # .NET 8 SDK for every dotnet command run from that folder.
      - name: Install the .NET Android workload
        working-directory: apps/CuePilot.Android
        run: |
          dotnet --version
          dotnet workload install android
      - name: Android platform 34 and build tools
        run: |
          SDKMANAGER="$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"
      # whisper.cpp for local speech recognition; rebuilt only when native/ changes.
      - name: Keep the whisper.cpp libraries between builds
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: apps/CuePilot.Android/native/out
          key: cuepilot-android-whisper-${{ hashFiles('apps/CuePilot.Android/native/*') }}
      - name: Build whisper.cpp for the phone
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: bash apps/CuePilot.Android/native/build-android.sh
      # Without a signing key in the secrets the APK is signed with the .NET debug key; it is cached so that
      # every build has the same key and installs over the previous one (the phone keeps its data).
      - name: Keep the debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.local/share/Xamarin/Mono for Android/debug.keystore
          key: cuepilot-android-debug-keystore
      - name: Signing key from the secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cuepilot.keystore"
            echo "SIGNING_ARGS=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/cuepilot.keystore -p:AndroidSigningKeyAlias=cuepilot -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        shell: bash -e -o pipefail {0}
        working-directory: apps/CuePilot.Android
        env:
          AVALONIA_TELEMETRY_OPTOUT: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION="$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' CuePilot.Android.csproj)"
          OUT="$GITHUB_WORKSPACE/dist"
          # Missing Android platform or build tools are installed by the SDK itself.
          dotnet build CuePilot.Android.csproj -t:InstallAndroidDependencies -f net8.0-android \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True --nologo 2>&1 | tee "$OUT-deps.log"
          dotnet publish CuePilot.Android.csproj -c Release -f net8.0-android \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" $SIGNING_ARGS -o "$OUT/android-build" --nologo 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          mkdir -p "$OUT/android"
          cp "$OUT"/android-build/*-Signed.apk "$OUT/android/CuePilot-$VERSION-android.apk"
          ls -la "$OUT/android"
      - name: Show build errors
        if: failure()
        run: grep -hE "error|fatal" build.log dist-deps.log 2>/dev/null | sort -u | tail -40 | sed 's/^/::error::/' || tail -40 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: CuePilot-android
          path: dist/android/*.apk

  smoke:
    # Starts the APK on an Android emulator (ARM code runs through the emulator's translation) and fails when
    # CuePilot does not survive the start; the log holds its logcat lines and a small screenshot.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CuePilot-android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash apps/CuePilot.Android/ci/smoke-test.sh dist/CuePilot-*.apk

  release:
    # The latest APK on the «android-latest» release page.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CuePilot-android
          path: dist
      - name: Publish android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create android-latest dist/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CuePilot для Android (последняя сборка)" --prerelease \
            --notes "APK для телефонов на Android 8 и новее. Скачайте файл на телефон и откройте его; Android попросит разрешить установку из этого источника."
