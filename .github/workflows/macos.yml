name: CuePilot for macOS

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          # Intel builds are cross-compiled on Apple Silicon: the Intel macos-13 runners are retired.
          - arch: x64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build CuePilot.app
        run: bash apps/CuePilot.Avalonia/macos/build-macos.sh ${{ matrix.arch }} 2>&1 | tee build.log
        shell: bash -o pipefail {0}
      - name: Show build errors
        if: failure()
        run: grep -iE "error|fatal|failed" build.log | tail -30 | sed 's/^/::error::/' || tail -30 build.log | sed 's/^/::error::/'
      - uses: actions/upload-artifact@v4
        with:
          name: CuePilot-mac-${{ matrix.arch }}
          path: |
            dist/macos/*.zip
            dist/macos/*.dmg

  release:
    # The latest installers on the «mac-latest» release page: one .dmg per Mac type, no nested zips.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish mac-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create mac-latest dist/*.dmg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CuePilot для macOS (последняя сборка)" --prerelease \
            --notes "arm64 — Mac на Apple Silicon (M1–M4), x64 — Mac на Intel. Как установить: apps/CuePilot.Avalonia/macos/README-tester.md"
